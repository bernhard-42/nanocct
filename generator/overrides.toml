# Hand-maintained exceptions to the generator's generic rules. Keep this file small; every entry
# is a documented deviation from the "derive everything from the headers" principle.

# Methods whose non-const reference parameters of primitive type are in/out: the value is read
# AND written (e.g. transform coordinates in place). The default rule treats such parameters as
# pure outputs (dropped from the Python signature, returned in a tuple). Listed methods keep them
# as inputs and still return the updated values.
inout = [
    "gp_Trsf::Transforms",
    "gp_Trsf2d::Transforms",
    "gp_GTrsf::Transforms",
    "gp_GTrsf2d::Transforms",
]

# Classes never bound (internal helpers that happen to be public in a header).
[skip]
classes = [
    "Standard_Static_Assert<true>",
    # implicitly copy/move constructible on paper, but a member (NCollection_CellFilter<...>::Cell inside an
    # NCollection_Map) has a deleted copy constructor; nanobind instantiates the move wrapper unconditionally
    # (std::is_move_constructible, no hook) -> hard compile error
    "math_GlobOptMin",
]
# C++ namespaces never bound: std (OCCT only adds std::hash specialisations there) and the implementation-detail
# namespaces OCCT keeps in headers for inline code (MathSys::detail, MathLin::Internal, BRepGraph_RefsIterator::Detail).
namespaces = ["std", "detail", "Detail", "Internal"]
# Headers not included in the package translation unit: platform-specific internals that OCCT
# itself only includes from .cxx files under #ifdef.
headers = [
    "OSD_WNT.hxx",          # Windows only (includes <windows.h>)
]
# Members declared in a header but never defined in the OCCT libraries (link errors otherwise).
# "Class::Name" skips every overload, "Class::Name(<param types>)" one overload. Methods without any
# defined overload are detected automatically (generator/symbols.py, nm on the toolkit library); only
# overload-specific cases need an entry here.
methods = [
    "TCollection_AsciiString::IsEqual(const TCollection_AsciiString &, const char *const)",
    "BSplCLib::DN(const double, const int, const NCollection_Array1<gp_Pnt> &, const NCollection_Array1<double> &, gp_Pnt &, gp_Vec &)",
    "BSplCLib::DN(const double, const int, const NCollection_Array1<gp_Pnt2d> &, const NCollection_Array1<double> &, gp_Pnt2d &, gp_Vec2d &)",
]

# NCollection instantiations to bind although no bound OCCT signature uses them (spelled with canonical
# argument types). They are registered by the NCollection package (TKernel).
[instantiate]
extra = [
    "NCollection_Map<int>",
    "NCollection_DataMap<int, double>",
    "NCollection_DataMap<TCollection_AsciiString, int>",
    "NCollection_IndexedMap<TCollection_AsciiString>",
    "NCollection_Array2<double>",
    "NCollection_HArray2<double>",
    "NCollection_DynamicArray<int>",
    "NCollection_DoubleMap<int, TCollection_AsciiString>",
    "NCollection_Shared<NCollection_Map<int>>",
    "NCollection_Sequence<opencascade::handle<Standard_Transient>>",
]
