[project]
name = "nanocct"
version = "8.0.1.0"
description = "nanobind (stable ABI) Python bindings for Open CASCADE Technology, 1:1 with the OCCT API"
requires-python = ">=3.12"
# numpy: the zero-copy array views return numpy arrays. 
dependencies = ["numpy>=2,<3"]
# the wheel bundles OCCT, FreeType, RapidJSON and nanobind: licenses/README.md and NOTICE
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt", "licenses/README.md"]

[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["src/nanocct"]
cmake.build-type = "Release"

# the generated .py/.pyi under src/nanocct are gitignored (Design.md 5.3); scikit-build-core's file selection
# honours .gitignore, so without this the wheel would hold only the .so files
[tool.scikit-build.sdist]
include = ["src/nanocct/**/*.py", "src/nanocct/**/*.pyi"]

# the same minimum macOS as the OCCT build (deps/build-occt-macos.sh); otherwise the SDK's own (26.0)
[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET = "11.1"

[tool.pytest.ini_options]
pythonpath = ["."]          # the tests import the generator package
addopts = "-rfExX"          # name failures, errors, xfails and xpasses (-r replaces the default fE)

[dependency-groups]
dev = [
    "delocate>=0.13.0 ; sys_platform == 'darwin'",
    "delvewheel>=1.13.1 ; sys_platform == 'win32'",
    "libclang>=18.1.1",
    "mypy>=2.3.1",
    "nanobind>=3.1.0",
    "pytest>=9.1.1",
    "scikit-build-core>=1.0.3",
    "ty>=0.0.82",
]
