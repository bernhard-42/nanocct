# Build, test and repair the nanocct wheel on five platforms: macOS arm64 and x86_64, Linux x86_64 and aarch64,
# Windows amd64 (State.md 8.17).
#
# Every step is a Makefile target, so CI and a local build are the same commands: `make env`, `make deps`,
# `make sources`, `make generate compile stubs wheel delocate test` -- each step once: the wheel is packed from what
# `compile` built (until 2026-09-28 `make wheel` compiled everything a second time), and the tests run against the
# repaired wheel in a fresh venv. The workflow adds only what the Makefile cannot know --
# the runner's missing tools and the two caches.
#
#   deps cache    deps/ install trees after `make deps` (OCCT, FreeType, FreeImage, RapidJSON), keyed on the scripts
#                 that build them, so the long OCCT build runs only when one of those scripts changes. GitHub drops
#                 a cache that has not been read for 7 days, so a quiet week costs one cold build.
#   wheel cache   the repaired wheel in dist/, keyed on the commit. release.yml restores it from there when that
#                 commit is tagged -- run this workflow on main: a tag run can read caches of the default branch,
#                 not of other branches.
#
# Linux runs on the host runner and the Makefile starts the manylinux_2_28 container itself (deps/run-manylinux.sh),
# exactly as on a Linux workstation -- there is one Linux build path, not a CI variant of it.
# Windows runs under Git Bash (`shell: bash` on a Windows runner), as the Makefile requires.
#
# The macOS arm64 job also builds the OCP compatibility shim (`make shim`, cadquery-ocp-novtk 8.0.1.0.0+shim), so
# packages that still `import OCP` run on nanocct while they are ported; release.yml attaches it next to the wheels.
name: Build wheels

# The platforms are check boxes in the "Run workflow" dialog, all ticked by default: a subset reruns only what failed
# while jobs of an earlier run go on (a job-level `if` cannot see the matrix, so the matrix itself is built from them).
on:
  workflow_dispatch:
    inputs:
      macos_arm64:   { description: "macOS arm64 (macos-15)",           type: boolean, default: true }
      macos_x86_64:  { description: "macOS x86_64 (macos-15-intel)",    type: boolean, default: true }
      linux_x86_64:  { description: "Linux x86_64 (ubuntu-24.04)",      type: boolean, default: true }
      linux_aarch64: { description: "Linux aarch64 (ubuntu-24.04-arm)", type: boolean, default: true }
      windows_amd64: { description: "Windows amd64 (windows-2025)",     type: boolean, default: true }

env:
  # Bump to throw away every deps cache without touching a build script.
  DEPS_CACHE_VERSION: "1"

jobs:
  # The platform table, filtered by the dispatch inputs. `platform` names the caches (deps-<platform>-...,
  # nanocct-wheel-<platform>-<sha>); release.yml lists the same five. The architecture is the runner's: nothing
  # cross-compiles. The Linux container image and the auditwheel tag follow `uname -m` (deps/run-manylinux.sh,
  # Makefile ML_PLAT); macOS builds natively for the host arch. `deps` is what the deps cache holds.
  select:
    name: select platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          MACOS_ARM64: ${{ inputs.macos_arm64 }}
          MACOS_X86_64: ${{ inputs.macos_x86_64 }}
          LINUX_X86_64: ${{ inputs.linux_x86_64 }}
          LINUX_AARCH64: ${{ inputs.linux_aarch64 }}
          WINDOWS_AMD64: ${{ inputs.windows_amd64 }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          native = "deps/occt-8.0.1\ndeps/freetype\ndeps/freeimage\ndeps/rapidjson\n"
          ml = "deps/occt-8.0.1-manylinux\ndeps/freetype-ml\ndeps/freeimage-ml\ndeps/rapidjson\n"
          # what each platform's deps are built from: the deps-cache key hashes these and nothing else, so a change for
          # one platform no longer rebuilds OCCT on the others
          fetch = "deps/fetch-*.sh"
          keys_macos = "\n".join([fetch, "deps/build-freetype-macos.sh", "deps/build-freeimage-macos.sh",
                                  "deps/build-occt-macos.sh", "deps/occt-unexported-symbols.txt",
                                  "deps/freeimage-exported-symbols.txt"])
          keys_linux = "\n".join([fetch, "deps/build-freetype-manylinux.sh", "deps/build-freeimage-manylinux.sh",
                                  "deps/build-occt-manylinux.sh", "deps/*.map", "deps/manylinux.Dockerfile",
                                  "deps/run-manylinux.sh"])
          keys_windows = "\n".join([fetch, "deps/build-freetype-windows.sh", "deps/build-freeimage-windows.sh",
                                    "deps/build-occt-windows.sh"])
          table = [
              ("MACOS_ARM64",   "macos-arm64",   "macos-15",         native, keys_macos),
              ("MACOS_X86_64",  "macos-x86_64",  "macos-15-intel",   native, keys_macos),
              ("LINUX_X86_64",  "linux-x86_64",  "ubuntu-24.04",     ml,     keys_linux),
              ("LINUX_AARCH64", "linux-aarch64", "ubuntu-24.04-arm", ml,     keys_linux),
              ("WINDOWS_AMD64", "windows-amd64", "windows-2025",     native, keys_windows),
          ]
          chosen = [{"platform": p, "runner": r, "deps": d, "deps_inputs": k}
                    for var, p, r, d, k in table if os.environ[var] == "true"]
          if len(chosen) == 0:
              raise SystemExit("no platform selected")
          print("matrix=" + json.dumps({"include": chosen}))
          EOF

  wheel:
    name: ${{ matrix.platform }}
    needs: select
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      # Before checkout: the build scripts are bash, and a CRLF checkout breaks them ($'\r': command not found).
      - name: (Windows) Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      # ---- tools the runner does not have --------------------------------------------------------------------------
      # uv drives the venv on macOS and Windows (`make env`); on Linux it lives in the container image.
      - name: (macOS, Windows) Install uv
        if: runner.os != 'Linux'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 #v9.0.0
        with:
          enable-cache: false

      # windows-2025 ships no GNU make (its image readme lists none); macOS has /usr/bin/make, Ubuntu make 4.3.
      - name: (Windows) Install make
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      # GitHub starts Git Bash as `bash --noprofile --norc`; an interactive Git Bash, which the Makefile expects, also has
      # /usr/bin/core_perl on PATH (/etc/profile.d/perlbin.sh), and that is where shasum lives -- the second run
      # (2026-09-28) stopped in fetch-rapidjson.sh with "shasum: command not found".
      - name: (Windows) Git Bash's login PATH
        if: runner.os == 'Windows'
        run: cygpath -w /usr/bin/core_perl >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          make --version | head -1
          if [ "$RUNNER_OS" = "Linux" ]; then docker --version; else uv --version; fi
          cmake --version | head -1
          if [ "$RUNNER_OS" != "Linux" ]; then ninja --version; fi
          if [ "$RUNNER_OS" = "Windows" ]; then command -v shasum; fi

      # ---- dependencies --------------------------------------------------------------------------------------------
      # matrix.deps_inputs is a newline-separated pattern list; hashFiles joins its arguments with newlines before
      # globbing anyway (actions/runner, HashFilesFunction.cs), so one such argument equals several.
      - name: Restore deps cache
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ matrix.deps }}
          key: deps-${{ matrix.platform }}-v${{ env.DEPS_CACHE_VERSION }}-${{ hashFiles(matrix.deps_inputs) }}

      - name: make deps
        if: steps.deps.outputs.cache-hit != 'true'
        run: make deps

      # Saved right after `make deps`, not at the end of the job: a failing test must not throw away the OCCT build.
      - name: Save deps cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ matrix.deps }}
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # The generator reads OCCT's FILES.cmake/EXTERNLIB.cmake from deps/occt-src, which is not in the cache (a
      # shallow clone is cheaper than 144 MB of cache). Idempotent: after a cold `make deps` it finds the sources.
      - name: make sources
        run: make sources

      # ---- the build -----------------------------------------------------------------------------------------------
      - name: make env
        run: make env

      - name: make generate
        run: make generate

      - name: make compile
        run: make compile

      - name: make stubs
        run: make stubs

      - name: make wheel
        run: make wheel

      - name: make delocate
        run: make delocate

      - name: make test
        run: make test

      # The shim is pure Python (py3-none-any): generated from the bindings of one platform and installed on all five. A
      # member another platform does not bind is looked up as None there (shim/OCP/_rt.py get()), so it is generated
      # where the bindings are the widest: macOS binds every package the others do plus Cocoa (overrides.toml
      # [platform]), and Windows binds fewer members (R-UNDEFINED). It lands in dist/ and so in this platform's cache.
      - name: make shim (macOS arm64 only)
        if: matrix.platform == 'macos-arm64'
        run: make shim

      # ---- the wheel -----------------------------------------------------------------------------------------------
      # enableCrossOsArchive: release.yml restores all five on one Ubuntu runner, and without it a cache saved on
      # Windows has a different cache version and cannot be restored anywhere else (actions/cache README). It is
      # set on every platform so the five save/restore pairs are identical; off Windows it changes nothing.
      - name: Save wheel cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: dist/*.whl
          key: nanocct-wheel-${{ matrix.platform }}-${{ github.sha }}
          enableCrossOsArchive: true

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.platform }}"
            echo '```'
            ls -l dist/*.whl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
