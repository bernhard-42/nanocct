[project]
name = "nanoocp"
version = "0.1.0"
description = "nanobind (stable ABI) Python bindings for Open CASCADE Technology, 1:1 with the OCCT API"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["src/nanoocp"]
cmake.build-type = "Release"

# The .py/.pyi shims under src/nanoocp are generated and therefore gitignored (Design.md 5.3), but they are the
# package's Python surface and must go into the wheel. scikit-build-core's file selection honours .gitignore
# (sdist.inclusion-mode "default"), and wheel.packages copying uses the same selection -- without this the wheel
# holds only the 45 .so files, `nanoocp` degrades to a namespace package, its eager __init__ never runs and the
# toolkits are never imported (found 2026-09-23: a missing NCollection accessor, then an abort under pytest).
[tool.scikit-build.sdist]
include = ["src/nanoocp/**/*.py", "src/nanoocp/**/*.pyi"]

# macOS wheels are tagged macosx_11_0_arm64 like the OCCT build (deps/build-occt.sh sets 11.1); without this the
# extension inherits the SDK's own minimum (measured: minos 26.0) and the wheel would not run on older systems.
[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET = "11.1"

[tool.pytest.ini_options]
pythonpath = ["."]          # tests import the generator package (report.txt reader, generator unit tests)

[dependency-groups]
dev = [
    "libclang>=18.1.1",
    "mypy>=2.3.1",
    "nanobind>=3.1.0",
    "pytest>=9.1.1",
    "scikit-build-core>=1.0.3",
    "ty>=0.0.82",
]
