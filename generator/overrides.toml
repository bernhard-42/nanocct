# Hand-maintained exceptions to the generator's generic rules. Keep this file small; every entry
# is a documented deviation from the "derive everything from the headers" principle.

# Methods whose non-const reference parameters of primitive or handle<T> type are in/out: the value is
# read AND written (e.g. transform coordinates in place, replace a curve by its extended version). The
# default rule treats such parameters as pure outputs (dropped from the Python signature, returned in a
# tuple). Listed methods keep them as inputs and still return the updated values. Each entry was checked
# against the .cxx body (the parameter is read before it is assigned).
inout = [
    "gp_Trsf::Transforms",
    "gp_Trsf2d::Transforms",
    "gp_GTrsf::Transforms",
    "gp_GTrsf2d::Transforms",
    "*::InitFromJson",      # int& theStreamPos: the position to start reading at (1), advanced by the call (every class with DumpJson)
    "Font_FontMgr::FindFont",   # Font_FontAspect& theFontAspect: the aspect to look for, replaced when an alias maps to another style (Font_FontMgr.cxx:1060, doc [in][out])
    # handle<T>& parameters that are read and replaced (GeomLib.cxx, GeomConvert.cxx, Geom2dConvert.cxx, 2026-09-21)
    "GeomLib::AdjustExtremity",            # Curve: converted to a BSpline, adjusted, assigned back
    "GeomLib::ExtendCurveToPoint",         # Curve: extended in place
    "GeomLib::ExtendSurfByLength",         # Surf: extended in place
    "GeomLib::CancelDenominatorDerivative",# BSurf: modified in place (ExchangeUV)
    "GeomConvert::C0BSplineToC1BSplineCurve",   # BS: split and re-concatenated, assigned back
    "Geom2dConvert::C0BSplineToC1BSplineCurve", # BS: same
    "*::ReadCompleteInfo",                 # handle<Storage_Data>& theData: used when non-null, created otherwise (Storage_BaseDriver, FSD_File, FSD_BinaryFile)
]

# Classes never bound (internal helpers that happen to be public in a header).
[skip]
classes = [
    "Standard_Static_Assert<true>",     # the specialisation behind the STANDARD_STATIC_ASSERT macro; no API
    "BOPTools_PairSelector<2>",         # OCCT bug: its virtual RejectNode builds a BVH_Box<double, 3> from 2D vectors, so the 2D
                                        # instantiation (BOPTools_Box2dPairSelector) cannot be instantiated in C++ either (2026-09-21)
]
# Classes that are copy/move constructible on paper but whose copy or move does not compile. nanobind instantiates its
# copy/move wrappers from the type traits (std::is_move_constructible has no hook), so such a class is bound through a
# generated wrapper struct with deleted copy and move constructors, under the original name (R-NONCOPYABLE). The parser
# detects the known causes itself (an NCollection_CellFilter or a container of a type with a deleted copy constructor held
# by value, and classes holding such a class by value); this list is for any case it cannot see.
noncopyable = [
]
# C++ namespaces never bound: std (OCCT only adds std::hash specialisations there) and the implementation-detail
# namespaces OCCT keeps in headers for inline code (MathSys::detail, MathLin::Internal, BRepGraph_RefsIterator::Detail).
namespaces = [
    "std",          # only std::hash<T> specialisations (bound as __hash__ of T, not as a namespace)
    "detail",       # MathSys::detail and friends: header-only implementation helpers
    "Detail",       # BRepGraph_RefsIterator::Detail: same
    "Internal",     # MathLin::Internal: same
]
# Headers not included in the package translation unit: platform-specific internals that OCCT
# itself only includes from .cxx files under #ifdef.
headers = [
    "OSD_WNT.hxx",          # Windows only (includes <windows.h>)
    "WNT_Dword.hxx",        # Windows only (includes <windows.h>); WNT_Window/WNT_WClass guard themselves with _WIN32
    # OCCT 8.0.1 packaging bug: these public headers include GeomBndLib_InfiniteHelpers.pxx, a private file that
    # is not installed (GeomBndLib_Curve/Curve2d include GeomBndLib_Line/Line2d). BndLib_Add3dCurve etc. cover the use.
    "GeomBndLib_Line.hxx",
    "GeomBndLib_Line2d.hxx",
    "GeomBndLib_Curve.hxx",
    "GeomBndLib_Curve2d.hxx",
]
# Members not bound although the header declares them. "Class::Name" skips every overload,
# "Class::Name(<param types>)" one overload. Members declared but never defined in the OCCT libraries are detected
# automatically, per overload (generator/symbols.py: nm on the toolkit library, compared by mangled name).
methods = [
    # Template members whose body does not compile for the instantiation (Design.md 6c): IntPolyh_Array<T>::Dump() calls
    # (*this)[i].Dump() with no argument, but IntPolyh_Edge/Triangle::Dump take an int and IntPolyh_PointNormal has none.
    # Points, SectionLines and StartPoints (Dump() exists) keep it. Debug printf output, no Python use (2026-09-21).
    "IntPolyh_Array<IntPolyh_Edge>::Dump",
    "IntPolyh_Array<IntPolyh_Triangle>::Dump",
    "IntPolyh_Array<IntPolyh_PointNormal>::Dump",
    # BVH_PairTraverse<T, N> with the default BVHSetType = void: Select() dereferences the (void) set; the overload taking two
    # BVH trees stays. The derived selectors (BRepExtrema_OverlapTool, IntPatch_BVHTraversal) call that one (2026-09-21).
    "BVH_PairTraverse<double, 3, void, double>::Select()",
    "BVH_PairTraverse<double, 2, void, double>::Select()",
    # NCollection_Vec3<unsigned long> (Image_PixMapData dimensions): cwiseAbs() calls std::abs(unsigned long), which is
    # ambiguous in C++ (no unsigned overload). Meaningless for an unsigned vector anyway (2026-09-22).
    "NCollection_Vec3<unsigned long>::cwiseAbs",
]

# NCollection instantiations to bind although no bound OCCT signature uses them (spelled with canonical
# argument types). They are registered by the NCollection package (TKernel).
[instantiate]
# Each entry exercises a binder kind (or a combination) that the bound OCCT signatures of the current scope do not
# reach yet, so tests/test_NCollection.py can cover it; they double as conveniences for users.
extra = [
    "NCollection_Map<int>",
    "NCollection_DataMap<int, double>",
    "NCollection_DataMap<TCollection_AsciiString, int>",
    "NCollection_IndexedMap<TCollection_AsciiString>",
    "NCollection_Array2<double>",
    "NCollection_HArray2<double>",
    "NCollection_DynamicArray<int>",
    "NCollection_DoubleMap<int, TCollection_AsciiString>",
    "NCollection_Shared<NCollection_Map<int>>",
    "NCollection_Sequence<opencascade::handle<Standard_Transient>>",
    "NCollection_LinearVector<double>",
    "NCollection_LinearVector<int>",
]

# Partial toolkits and packages, for the font/text-to-BRep slice of Visualization (Design.md 2). A whole toolkit and a
# whole package are the default; an entry here is the exception. `packages`: toolkit -> the only packages generated
# (the toolkit module is complete with respect to this list). `headers`: package -> the only headers parsed and bound,
# every other header of the package is reported as "not in the allowlist". Names are validated against OCCT's
# PACKAGES.cmake / FILES.cmake. Filled in when the slice is generated (Phase 2); the planned entries:
#   packages = { TKService = ["Font", "Graphic3d"], TKV3d = ["StdPrs"] }
#   headers = { Graphic3d = ["Graphic3d_HorizontalTextAlignment.hxx", "Graphic3d_VerticalTextAlignment.hxx"],
#               StdPrs = ["StdPrs_BRepFont.hxx", "StdPrs_BRepTextBuilder.hxx"] }
[include]
packages = {}
headers = {}

# Packages whose stream parameters carry a binary format: a std::ostream& result is returned as bytes and a
# std::istream& parameter takes a binary file-like object (io.BytesIO), instead of str / typing.TextIO (Design.md 6,
# R-STREAM-OUT/IN). Everything else OCCT streams is text (Dump, DumpJson, BRepTools::Write, ...).
[stream]
binary_packages = [
    "BinTools",      # BinTools::Write/Read, BinTools_ShapeSet & co.: the binary BRep format (BinLDrivers etc. follow in Phase 2)
    "PCDM",          # PCDM_Reader::Read / PCDM_Writer::Write / PCDM::FileFormat: format-agnostic document streams, binary is the superset (XML decodes from bytes)
    "CDF",           # CDF_Application::Read(istream): same document streams
]
