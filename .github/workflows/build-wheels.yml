# Build, test and repair the OCP3x wheel on five platforms: macOS arm64 and x86_64, Linux x86_64 and aarch64,
# Windows amd64 (State.md 8.17).
#
# Every step is a Makefile target, so CI and a local build are the same commands: `make env`, `make deps`,
# `make sources`, `make generate compile stubs test wheel`. The workflow adds only what the Makefile cannot know --
# the runner's missing tools and the two caches.
#
#   deps cache    deps/ install trees after `make deps` (OCCT, FreeType, FreeImage, RapidJSON), keyed on the scripts
#                 that build them, so the long OCCT build runs only when one of those scripts changes. GitHub drops
#                 a cache that has not been read for 7 days, so a quiet week costs one cold build.
#   wheel cache   the repaired wheel in dist/, keyed on the commit. release.yml restores it from there when that
#                 commit is tagged -- run this workflow on main: a tag run can read caches of the default branch,
#                 not of other branches.
#
# Linux runs on the host runner and the Makefile starts the manylinux_2_28 container itself (deps/run-manylinux.sh),
# exactly as on a Linux workstation -- there is one Linux build path, not a CI variant of it.
# Windows runs under Git Bash (`shell: bash` on a Windows runner), as the Makefile requires.
#
# The shim wheel is deliberately not built here (`make wheels` would): it is a local test vehicle, not released.
name: Build wheels

on: workflow_dispatch

env:
  # Bump to throw away every deps cache without touching a build script.
  DEPS_CACHE_VERSION: "1"

jobs:
  wheel:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `platform` names the caches (deps-<platform>-..., ocp3x-wheel-<platform>-<sha>); release.yml lists the same five.
        # The architecture is the runner's: nothing cross-compiles. The Linux container image and the auditwheel tag
        # follow `uname -m` (deps/run-manylinux.sh, Makefile ML_PLAT); macOS builds natively for the host arch.
        include:
          - platform: macos-arm64
            runner: macos-15
            deps: |
              deps/occt-8.0.1
              deps/freetype
              deps/freeimage
              deps/rapidjson
          - platform: macos-x86_64
            runner: macos-15-intel
            deps: |
              deps/occt-8.0.1
              deps/freetype
              deps/freeimage
              deps/rapidjson
          - platform: linux-x86_64
            runner: ubuntu-24.04
            deps: |
              deps/occt-8.0.1-manylinux
              deps/freetype-ml
              deps/freeimage-ml
              deps/rapidjson
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            deps: |
              deps/occt-8.0.1-manylinux
              deps/freetype-ml
              deps/freeimage-ml
              deps/rapidjson
          - platform: windows-amd64
            runner: windows-2025
            deps: |
              deps/occt-8.0.1
              deps/freetype
              deps/freeimage
              deps/rapidjson
    defaults:
      run:
        shell: bash

    steps:
      # Before checkout: the build scripts are bash, and a CRLF checkout breaks them ($'\r': command not found).
      - name: (Windows) Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      # ---- tools the runner does not have --------------------------------------------------------------------------
      # uv drives the venv on macOS and Windows (`make env`); on Linux it lives in the container image.
      - name: (macOS, Windows) Install uv
        if: runner.os != 'Linux'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 #v9.0.0
        with:
          enable-cache: false

      # windows-2025 ships no GNU make (its image readme lists none); macOS has /usr/bin/make, Ubuntu make 4.3.
      - name: (Windows) Install make
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: Tool versions
        run: |
          make --version | head -1
          if [ "$RUNNER_OS" = "Linux" ]; then docker --version; else uv --version; fi
          cmake --version | head -1
          if [ "$RUNNER_OS" != "Linux" ]; then ninja --version; fi

      # ---- dependencies --------------------------------------------------------------------------------------------
      - name: Restore deps cache
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ matrix.deps }}
          key: deps-${{ matrix.platform }}-v${{ env.DEPS_CACHE_VERSION }}-${{ hashFiles('deps/fetch-*.sh', 'deps/build-freetype-*.sh', 'deps/build-freeimage-*.sh', 'deps/build-occt-*.sh', 'deps/*.map', 'deps/occt-unexported-symbols.txt', 'deps/manylinux.Dockerfile', 'deps/run-manylinux.sh') }}

      - name: make deps
        if: steps.deps.outputs.cache-hit != 'true'
        run: make deps

      # Saved right after `make deps`, not at the end of the job: a failing test must not throw away the OCCT build.
      - name: Save deps cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ matrix.deps }}
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # The generator reads OCCT's FILES.cmake/EXTERNLIB.cmake from deps/occt-src, which is not in the cache (a
      # shallow clone is cheaper than 144 MB of cache). Idempotent: after a cold `make deps` it finds the sources.
      - name: make sources
        run: make sources

      # ---- the build -----------------------------------------------------------------------------------------------
      - name: make env
        run: make env

      - name: make generate
        run: make generate

      - name: make compile
        run: make compile

      - name: make stubs
        run: make stubs

      - name: make test
        run: make test

      - name: make wheel
        run: make wheel

      # ---- the wheel -----------------------------------------------------------------------------------------------
      # enableCrossOsArchive: release.yml restores all five on one Ubuntu runner, and without it a cache saved on
      # Windows has a different cache version and cannot be restored anywhere else (actions/cache README). It is
      # set on every platform so the five save/restore pairs are identical; off Windows it changes nothing.
      - name: Save wheel cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: dist/*.whl
          key: ocp3x-wheel-${{ matrix.platform }}-${{ github.sha }}
          enableCrossOsArchive: true

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.platform }}"
            echo '```'
            ls -l dist/*.whl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
