# Attach the five OCP3x wheels of a tagged commit to a GitHub release (State.md 8.17).
#
# Nothing is built here. The wheels come from the cache build-wheels.yml saved for this exact commit
# (ocp3x-wheel-<platform>-<sha>), so what is released is what was built and tested. Hence the order:
#
#   1. run "Build wheels" on main (Actions tab -> Run workflow) and let it pass on all five platforms
#   2. tag that commit and push the tag:  git tag v0.1.0 <sha> && git push origin v0.1.0
#
# A tag run can restore caches of the default branch only, and GitHub drops a cache not read for 7 days -- so the
# build must have run on main within the last week. A missing wheel fails the run; nothing is released partially.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04

    steps:
      # path and enableCrossOsArchive must match the save step in build-wheels.yml exactly: both go into the cache
      # version, and a different spelling is a different cache.
      - name: Restore macOS arm64 wheel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: dist/*.whl
          key: ocp3x-wheel-macos-arm64-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore macOS x86_64 wheel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: dist/*.whl
          key: ocp3x-wheel-macos-x86_64-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore Linux x86_64 wheel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: dist/*.whl
          key: ocp3x-wheel-linux-x86_64-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore Linux aarch64 wheel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: dist/*.whl
          key: ocp3x-wheel-linux-aarch64-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore Windows amd64 wheel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: dist/*.whl
          key: ocp3x-wheel-windows-amd64-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # Exactly one wheel per platform, and each carries the version the tag names (v0.1.0 -> ocp3x-0.1.0-...).
      - name: Check wheels against the tag
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          ls -l dist
          for plat in macosx_11_0_arm64 macosx_11_0_x86_64 manylinux_2_28_x86_64 manylinux_2_28_aarch64 win_amd64; do
            found=(dist/ocp3x-"$version"-cp312-abi3-*"$plat"*.whl)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "expected exactly one ocp3x-$version wheel for $plat, found ${#found[@]}" >&2
              exit 1
            fi
          done
          all=(dist/*.whl)
          if [ "${#all[@]}" -ne 5 ]; then
            echo "expected 5 wheels in dist/, found ${#all[@]}" >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 #v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: OCP3x ${{ github.ref_name }}
          files: dist/*.whl
          fail_on_unmatched_files: true
