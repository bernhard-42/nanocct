# Hand-maintained exceptions to the generator's generic rules. Keep this file small; every entry
# is a documented deviation from the "derive everything from the headers" principle.

# Methods whose non-const reference parameters of primitive or handle<T> type are in/out: the value is
# read AND written (e.g. transform coordinates in place, replace a curve by its extended version). The
# default rule treats such parameters as pure outputs (dropped from the Python signature, returned in a
# tuple). Listed methods keep them as inputs and still return the updated values. Each entry was checked
# against the .cxx body (the parameter is read before it is assigned).
# Entries are glob patterns on the qualified name: "gp_Trsf::Transforms", "*::InitFromJson", "DE*_Provider::Read".
inout = [
    "gp_Trsf::Transforms",
    "gp_Trsf2d::Transforms",
    "gp_GTrsf::Transforms",
    "gp_GTrsf2d::Transforms",
    "*::InitFromJson",      # int& theStreamPos: the position to start reading at (1), advanced by the call (every class with DumpJson)
    "Font_FontMgr::FindFont",   # Font_FontAspect& theFontAspect: the aspect to look for, replaced when an alias maps to another style (Font_FontMgr.cxx:1060, doc [in][out])
    # handle<T>& parameters that are read and replaced (GeomLib.cxx, GeomConvert.cxx, Geom2dConvert.cxx, 2026-09-21)
    "GeomLib::AdjustExtremity",            # Curve: converted to a BSpline, adjusted, assigned back
    "GeomLib::ExtendCurveToPoint",         # Curve: extended in place
    "GeomLib::ExtendSurfByLength",         # Surf: extended in place
    "GeomLib::CancelDenominatorDerivative",# BSurf: modified in place (ExchangeUV)
    "GeomConvert::C0BSplineToC1BSplineCurve",   # BS: split and re-concatenated, assigned back
    "Geom2dConvert::C0BSplineToC1BSplineCurve", # BS: same
    "*::ReadCompleteInfo",                 # handle<Storage_Data>& theData: used when non-null, created otherwise (Storage_BaseDriver, FSD_File, FSD_BinaryFile)
    # handle<XSControl_WorkSession>& theWS of the DataExchange providers: documented @param[in], read by the call
    # (personizeWS: theWS->NormAdaptor(), DESTEP_Provider.cxx:692-707) and replaced only when it is null (2026-09-22)
    "DE_Provider::Read",
    "DE_Provider::Write",
    "DE_Wrapper::Read",
    "DE_Wrapper::Write",
    # ... and in every format provider, which all repeat that body verbatim (DESTEP, DEIGES, DESTL, DEOBJ, DEPLY,
    # DEGLTF, DEVRML): entries are glob patterns on the qualified name, so one pair covers the toolkits still to come.
    "DE*_Provider::Read",
    "DE*_Provider::Write",
    # handle<XSControl_WorkSession>& WS of the controllers: the session to configure, dereferenced right away
    # (WS->NamedItem("xst-model-roots"), STEPControl_Controller.cxx) and never replaced. Three overrides in scope
    # (XSControl_Controller, STEPControl_Controller, IGESControl_Controller), all with the same contract.
    "*::Customise",
]

# Classes never bound (internal helpers that happen to be public in a header).
[skip]
classes = [
    "Standard_Static_Assert<true>",     # the specialisation behind the STANDARD_STATIC_ASSERT macro; no API
    "BOPTools_PairSelector<2>",         # OCCT bug: its virtual RejectNode builds a BVH_Box<double, 3> from 2D vectors, so the 2D
                                        # instantiation (BOPTools_Box2dPairSelector) cannot be instantiated in C++ either (2026-09-21)
    # An unexported destructor of a class held *by value*: the holder's implicit destructor needs it, and every bound
    # class needs its own destructor because nanobind instantiates wrap_destruct<T>. Nothing narrower exists here --
    # a destructor is not optional (measured on gauss 2026-09-24: destroying through an outside pointer -> LNK2019).
    "OpenGl_GraduatedTrihedron",         # its nested Axis, held by value, has an unexported ~Axis
    # Classes with an unexported virtual where removing the constructors is *not* enough: MSVC still emits the vtable,
    # so the slot still has to be filled. Measured on gauss 2026-09-24 -- with only their constructors skipped the
    # build came back 41/45, and these were the four failures; the three in [skip] constructors below linked fine.
    # For OpenGl_TriangleSet the reference is explicit: `[thunk]: OpenGl_TriangleSet::Box'adjustor{32}'`, an adjustor
    # thunk from multiple inheritance, which is emitted with the second base's vtable and does not depend on
    # construction at all. For the others the symbol comes from data (LNK2001, no referencing function) -- the vtable
    # is emitted although nothing constructs the class, and I have not pinned down what pulls it in (nanobind's
    # typeid-based type registration is the suspect; PCDM_DOMHeaderParser is not polymorphic-with-RTTI either and does
    # link, so the RTTI story alone does not explain it).
    "BinTools_ShapeWriter",              # the private virtual WriteShape
    "ShapeAnalysis_BoxBndTreeSelector",  # Accept, Reject
    "OpenGl_TriangleSet",                # Box, through an adjustor thunk (multiple inheritance)
    # generateMesh is a protected inline virtual calling BRepMesh_Delaun::ProcessConstraints, itself inline and calling
    # the unexported frontierAdjust/insertInternalEdges -- two levels of inlining reached through the vtable, which is
    # emitted even with the constructors gone. BRepMesh_DelabellaBaseMeshAlgo inherits the slot without overriding it.
    "BRepMesh_CustomBaseMeshAlgo",
    "BRepMesh_DelabellaBaseMeshAlgo",
    # ~StepFile_ReadData() is defined inline as { ClearRecorder(3); } (StepFile_ReadData.hxx:126) and ClearRecorder is
    # not exported on Windows. nanobind instantiates wrap_destruct<T> for every bound class, so unlike the inline
    # members above there is nothing narrower to skip -- the destructor is not optional. Internal STEP parser state;
    # StepFile_Read(stream, model, ...) is the public entry point and stays bound.
    "StepFile_ReadData",
    # Storage_InternalData holds a Storage_BucketOfPersistent *by value* (Storage_InternalData.hxx:50), and that
    # class's destructor is not exported on Windows -- so the implicit ~Storage_InternalData does not link, the same
    # mechanism as OpenGl_GraduatedTrihedron::Axis above. Internal bookkeeping of the persistence layer.
    "Storage_InternalData",
    # Classes whose destructor OCCT declares but does not export: R-UNDEFINED's destructor check drops them on
    # Windows by itself (nanobind instantiates wrap_destruct<T> for every bound class), which would leave the API
    # depending on the platform that generated it. Listed here so all three drop them. 12 members in total, all
    # internal: the OBJ material-file reader, two persistence buckets, a BRepGraph cache scope guard and a GL
    # setter selector; the public readers and writers around them stay bound (2026-09-23).
    "RWObj_MtlReader",
    "Storage_Bucket",
    "Storage_BucketOfPersistent",
    "BRepGraphInc_Reconstruct::Cache::TempScope",
    "OpenGl_VariableSetterSelector",
]
# Classes bound without constructors: everything else about them stays, they just cannot be created from Python.
#
# On MSVC the constructor is what stores the vptr, so it is the only thing that needs the class's vtable -- and a
# vtable slot cannot be filled for a virtual OCCT declares without Standard_EXPORT. Measured on gauss 2026-09-24 with
# minimal cases: placement new -> LNK2019, while binding the class, calling its methods through a pointer and
# nanobind's wrap_destruct<T> all link cleanly. So these classes do not have to be dropped, only their constructors.
# Unix exports everything a header declares and never notices; the constructors go on every platform anyway, so the
# API does not depend on which platform generated it.
#
# All of them are objects OCCT hands out rather than ones a caller builds: BVH selectors passed to a traversal, a GL
# primitive owned by the driver, an XML header parser, a shape writer, two mesh-algorithm bases.
# Measured, not predicted: of the eight candidates only these three link with the constructors removed. For the other
# five MSVC emits the vtable anyway, so they stay in [skip] classes above -- see the note there.
constructors = [
    "PCDM_DOMHeaderParser",                  # startElement, endElement
    "BRepClass3d_BndBoxTreeSelectorLine",    # Accept
    "BRepClass3d_BndBoxTreeSelectorPoint",   # Accept
]
# A signature wider than this is skipped, method or constructor. nanobind builds the signature by recursing once per
# parameter and MSVC then hits "fatal error C1202: recursive type or function dependency context too complex", which
# no flag raises (/constexpr:depth2048 and /constexpr:steps100000000 both tested). Measured: 37 parameters compile,
# 40 do not, so the cut sits between them. Exactly one signature in the whole tree is affected -- the 40-argument
# StepData_EnumTool("e0","e1",...) convenience constructor; the class keeps its other members and AddDefinition()
# builds the same table one value at a time.
max_params = 38

# Classes that are copy/move constructible on paper but whose copy or move does not compile. nanobind instantiates its
# copy/move wrappers from the type traits (std::is_move_constructible has no hook), so such a class is bound through a
# generated wrapper struct with deleted copy and move constructors, under the original name (R-NONCOPYABLE). The parser
# detects the known causes itself (an NCollection_CellFilter or a container of a type with a deleted copy constructor held
# by value, and classes holding such a class by value); this list is for any case it cannot see.
noncopyable = [
]
# C++ namespaces never bound: std (OCCT only adds std::hash specialisations there) and the implementation-detail
# namespaces OCCT keeps in headers for inline code (MathSys::detail, MathLin::Internal, BRepGraph_RefsIterator::Detail).
namespaces = [
    "std",          # only std::hash<T> specialisations (bound as __hash__ of T, not as a namespace)
    "detail",       # MathSys::detail and friends: header-only implementation helpers
    "Detail",       # BRepGraph_RefsIterator::Detail: same
    "Internal",     # MathLin::Internal: same
    "MurmurHash",   # opencascade::MurmurHash::MurmurHashUtils (Standard_HashUtils.lxx): the hash mixer behind std::hash, header-only
    "rapidjson",    # the vendored JSON library (8.13): RWGltf_GltfJsonParser derives from rapidjson::GenericDocument,
                    # which pulled its allocators, stream wrappers and UTF8<char> encoder into the RWGltf package.
                    # Third-party implementation detail with no OCCT or Python meaning (2026-09-22).
    "step",         # the bison/flex STEP parser (step.tab.hxx: step::parser, step::scanner, basic_symbol, context, stack).
                    # Generated internals with no Python meaning; the members of the basic_symbol<by_kind> instantiation are
                    # also not exported from libTKDESTEP, so the nm check cannot see them (6c: instantiations have no symbols)
                    # and _TKDESTEP failed to link. StepFile_Read(stream, model, ...) is the public entry point.
]
# Headers not included in the package translation unit: platform-specific internals that OCCT
# itself only includes from .cxx files under #ifdef.
headers = [
    "OSD_WNT.hxx",          # Windows only (includes <windows.h>)
    "WNT_Dword.hxx",        # Windows only (includes <windows.h>); WNT_Window/WNT_WClass guard themselves with _WIN32
    # OCCT 8.0.1 packaging bug: these public headers include GeomBndLib_InfiniteHelpers.pxx, a private file that
    # is not installed (GeomBndLib_Curve/Curve2d include GeomBndLib_Line/Line2d). BndLib_Add3dCurve etc. cover the use.
    "GeomBndLib_Line.hxx",
    "GeomBndLib_Line2d.hxx",
    "GeomBndLib_Curve.hxx",
    "GeomBndLib_Curve2d.hxx",
    # OpenGL ES only: declares GLES function-pointer typedefs through GL_APIENTRYP, which is defined by the GLES
    # headers. This build is USE_GLES2=OFF and OpenGl_GlFunctions.hxx only includes it under GL_ES_VERSION_2_0, so
    # libclang sees GL_APIENTRYP/GLenum undefined ("expected ')'", 20 parse errors) (2026-09-22).
    "OpenGl_GLESExtensions.hxx",
]
# Members not bound although the header declares them. "Class::Name" skips every overload,
# "Class::Name(<param types>)" one overload. Members declared but never defined in the OCCT libraries are detected
# automatically, per overload (generator/symbols.py: nm on the toolkit library, compared by mangled name).
methods = [
    # Stream setters that *store* the reference (myOStream = &theStream): the lambda's std::stringstream would dangle after
    # the call (R-STREAM-OUT/IN only cover streams used during the call; constructors are excluded for the same reason).
    # The only two in OCCT outside constructors (grep "= &the.*Stream", 2026-09-22); Persistent::Write/Read take the stream
    # per call and stay.
    "BinObjMgt_Persistent::SetOStream",
    "BinObjMgt_Persistent::SetIStream",
    # std::abs(unsigned int) is ambiguous (float/double/long double candidates all convert), so cwiseAbs does not
    # compile for an unsigned element type. OCCT never instantiates it -- a template member is only instantiated when
    # used -- and binding the class is what forces it. NCollection_Vec2<unsigned int> arrived with the reference
    # parameters of OpenGl_FrameBuffer (2026-09-23); the bool instantiations are fine, bool promotes to int.
    "NCollection_Vec2<unsigned int>::cwiseAbs",
    # Template members whose body does not compile for the instantiation (Design.md 6c): IntPolyh_Array<T>::Dump() calls
    # (*this)[i].Dump() with no argument, but IntPolyh_Edge/Triangle::Dump take an int and IntPolyh_PointNormal has none.
    # Points, SectionLines and StartPoints (Dump() exists) keep it. Debug printf output, no Python use (2026-09-21).
    "IntPolyh_Array<IntPolyh_Edge>::Dump",
    "IntPolyh_Array<IntPolyh_Triangle>::Dump",
    "IntPolyh_Array<IntPolyh_PointNormal>::Dump",
    # BVH_PairTraverse<T, N> with the default BVHSetType = void: Select() dereferences the (void) set; the overload taking two
    # BVH trees stays. The derived selectors (BRepExtrema_OverlapTool, IntPatch_BVHTraversal) call that one (2026-09-21).
    "BVH_PairTraverse<double, 3, void, double>::Select()",
    "BVH_PairTraverse<double, 2, void, double>::Select()",
    # NCollection_Vec3<unsigned long> (Image_PixMapData dimensions): cwiseAbs() calls std::abs(unsigned long), which is
    # ambiguous in C++ (no unsigned overload). Meaningless for an unsigned vector anyway (2026-09-22).
    "NCollection_Vec3<unsigned long>::cwiseAbs",
    # The same instantiation on Windows. `size_t` is `unsigned long` on LP64 (macOS, Linux) and `unsigned long long` on
    # LLP64 (Windows), and these keys are canonical C++ spellings, so one type needs two entries -- the first port
    # issue where the *override* had to grow rather than the generator (2026-09-23; MSVC offers six abs overloads,
    # int/long/__int64/double/float/long double, and none of them wins). The `unsigned char` instantiations are fine
    # everywhere: they promote to int, so abs(int) is an exact match.
    "NCollection_Vec3<unsigned long long>::cwiseAbs",
    "NCollection_Vec2<unsigned long long>::cwiseAbs",
    # Inline members whose *body* calls something OCCT does not export on Windows. R-UNDEFINED skips the callee
    # correctly, but an inline caller needs no symbol of its own, so it is bound and the compiler then emits the call
    # into our object file -- LNK2019 (gauss, 2026-09-23). Unix exports everything a header declares, so none of this
    # shows up there; the members are skipped on every platform anyway, to keep the API identical.
    # Each entry names the inline member and, after the arrow, the unexported callee its body names.
    "BRepGraph_UsagePath::operator==",       # -> IsEqual
    "BRepMesh_EdgeDiscret::operator()",      # -> process
    "BRepMesh_FaceChecker::operator()",      # -> perform
    "BRepMesh_ModelHealer::operator()",      # -> process
    "BRepMesh_Delaun::ProcessConstraints",   # -> insertInternalEdges, frontierAdjust
    "BRepMesh_Delaun::Frontier",             # -> getEdgesByType
    "BRepMesh_Delaun::InternalEdges",        # -> getEdgesByType
    "BRepMesh_Delaun::FreeEdges",            # -> getEdgesByType
    "LDOM_BasicAttribute::SetValue",         # -> the private LDOMString(LDOMBasicString, handle<LDOM_MemManager>)
    "LDOM_BasicText::SetData",               # -> the same private constructor
    "LDOM_MemManager::Hash",                 # -> the private static LDOM_MemManager::HashTable::Hash
]

# NCollection instantiations to bind although no bound OCCT signature uses them (spelled with canonical
# argument types). They are registered by the NCollection package (TKernel).
[instantiate]
# Each entry exercises a binder kind (or a combination) that the bound OCCT signatures of the current scope do not
# reach yet, so tests/test_NCollection.py can cover it; they double as conveniences for users.
extra = [
    "NCollection_Map<int>",
    "NCollection_DataMap<int, double>",
    "NCollection_DataMap<TCollection_AsciiString, int>",
    "NCollection_IndexedMap<TCollection_AsciiString>",
    "NCollection_Array2<double>",
    "NCollection_HArray2<double>",
    "NCollection_DynamicArray<int>",
    "NCollection_DoubleMap<int, TCollection_AsciiString>",
    "NCollection_Shared<NCollection_Map<int>>",
    "NCollection_Sequence<opencascade::handle<Standard_Transient>>",
    "NCollection_LinearVector<double>",
    "NCollection_LinearVector<int>",
]

# Partial toolkits and packages, for the font/text-to-BRep slice of Visualization (Design.md 2). A whole toolkit and a
# whole package are the default; an entry here is the exception. `packages`: toolkit -> the only packages generated
# (the toolkit module is complete with respect to this list). `headers`: package -> the only headers parsed and bound,
# every other header of the package is reported as "not in the allowlist". Names are validated against OCCT's
# PACKAGES.cmake / FILES.cmake. Filled in when the slice is generated (Phase 2); the planned entries:
#   packages = { TKService = ["Font", "Graphic3d"], TKV3d = ["StdPrs"] }
#   headers = { Graphic3d = ["Graphic3d_HorizontalTextAlignment.hxx", "Graphic3d_VerticalTextAlignment.hxx"],
#               StdPrs = ["StdPrs_BRepFont.hxx", "StdPrs_BRepTextBuilder.hxx"] }
[include]
packages = {}
headers = {}

# Packages OCCT only compiles on their own platform: parsed there, skipped everywhere else (platform.system() values).
# The list is short on purpose -- most of what *looks* platform specific is built everywhere, and skipping it
# would throw away working bindings.
# Exported symbols in TKService, measured on all three 2026-09-23 (nm -gU / nm -D / dumpbin /EXPORTS):
#   Cocoa  macOS 25  Linux  0  Windows  0   <- the only one empty off its own platform, and empty on both others
#   WNT    macOS  7  Linux 10  Windows 36   (WNT_HIDSpaceMouse, WNT_WClass: 9 methods bound on macOS)
#   Xw     macOS 20  Linux 23  Windows 16   (the Linux build has USE_XLIB=OFF and exports them anyway)
#   Wasm   macOS 23  Linux 26  Windows 20
# Without the skip, Cocoa on Windows costs a parse and emits an empty shell (5 classes, 0 defs, 21 report lines);
# and on a box with only the OCCT headers staged, R-UNDEFINED cannot strip it, so the build would fail to link.
[platform]
Cocoa = ["Darwin"]

# Toolkits a module must link although nothing in its own signatures names them. R-LINK derives the link line from the
# toolkits that own the headers the module includes, which misses a symbol reached *through* such a header. Nothing
# notices on Unix -- the dynamic linker resolves it through OCCT's own dependencies -- but every Windows import library
# has to be named explicitly, so there it is an LNK2019 (gauss, 2026-09-23):
#   _TKService/Font.cpp includes Font_BRepFont.hxx for the deprecated Font_BRepFont alias; that header is really
#   StdPrs_BRepFont.hxx, and StdPrs_BRepFont holds a Geom2dConvert_CompCurveToBSplineCurve *by value*
#   (StdPrs_BRepFont.hxx:215), whose constructor lives in TKGeomBase.
[link]
extra = { TKService = ["TKGeomBase"] }

# Packages whose stream parameters carry a binary format: a std::ostream& result is returned as bytes and a
# std::istream& parameter takes a binary file-like object (io.BytesIO), instead of str / typing.TextIO (Design.md 6,
# R-STREAM-OUT/IN). Everything else OCCT streams is text (Dump, DumpJson, BRepTools::Write, ...).
[stream]
binary_packages = [
    "BinTools",      # BinTools::Write/Read, BinTools_ShapeSet & co.: the binary BRep format (BinLDrivers etc. follow in Phase 2)
    "PCDM",          # PCDM_Reader::Read / PCDM_Writer::Write / PCDM::FileFormat: format-agnostic document streams, binary is the superset (XML decodes from bytes)
    "CDF",           # CDF_Application::Read(istream): same document streams
    "BinLDrivers",   # the binary OCAF format (TKBinL): document storage/retrieval drivers, sections
    "BinObjMgt",     # BinObjMgt_Persistent::Write/Read, BinObjMgt_Position
    "BinMDF",        # attribute driver bases (no streams today, listed for consistency)
    "BinMDataStd",
    "BinMDocStd",
    "BinMFunction",
    "BinDrivers",    # the full BinOcaf format (TKBin): shapes through BinMNaming/BinTools
    "BinMDataXtd",
    "BinMNaming",
    # The XML formats too: XmlLDrivers_DocumentStorageDriver::Write / RetrievalDriver::Read override the PCDM_Writer/Reader
    # virtuals that already take bytes / BinaryIO (PCDM above), TDocStd_Application.SaveAs(doc) returns bytes for an XML
    # document as well, and a serialised XML document is a byte sequence with an encoding declaration (bytes.decode() /
    # xml.etree accept it). Document streams are bytes whatever the format (2026-09-22).
    "XmlLDrivers",
    "XmlDrivers",
    "XmlXCAFDrivers",
    # BinXCAFDrivers and XmlXCAFDrivers declare no streams of their own (checked 2026-09-23): their storage and
    # retrieval drivers only override AttributeDrivers, and Write/Read come from BinDrivers/XmlDrivers above. Both
    # are listed for the same reason as BinMDF -- so that an override added by a later OCCT version is binary from
    # the start, as a document stream must be.
    "BinXCAFDrivers",
    "XmlMDataXtd",
    "XmlMNaming",
    # DataExchange: the streams of DE carry raw CAD file content, not text -- DE_ValidationUtils::CreateContentBuffer
    # reads 2048 bytes with reinterpret_cast<char*> from a stream the path overload opens with std::ios::binary
    # (DE_ValidationUtils.cxx:317-339, :295), and DE_Wrapper::FindReadProvider probes the same content (.glb, binary STL).
    "DE",
]
# Single members whose streams carry a document (binary or XML) inside a package whose other streams are text (DumpJson):
# Class::method, every overload.
binary_members = [
    "TDocStd_Application::Open",     # Open(istream&, doc) reads a binary or XML OCAF document
    "TDocStd_Application::SaveAs",   # SaveAs(doc, ostream&) writes one
    # RWStl is genuinely mixed: STL exists as an ASCII and a binary format and the package writes and reads both.
    # WriteAscii/ReadAsciiStream stay text; these five carry binary content (ReadStream and IsAscii sniff the format,
    # so bytes is the superset there, as for PCDM).
    "RWStl::WriteBinary",
    "RWStl::ReadBinaryStream",
    "RWStl::ReadStream",
    "RWStl_Reader::ReadBinary",
    "RWStl_Reader::IsAscii",
    # The mesh readers are binary too, and for the same reason: RWMesh_CafReader::Perform(path) and ProbeHeader(path)
    # open the file with std::ios_base::binary and hand that stream to the istream& overload
    # (RWMesh_CafReader.hxx:187,225). glTF is the case in point -- .glb is binary and .gltf is JSON, and ProbeHeader
    # sniffs which one it got, so bytes is the superset (2026-09-22; TKRWMesh had bound them as text).
    "RWMesh_CafReader::Perform",
    "RWMesh_CafReader::ProbeHeader",
    "RWGltf_TriangulationReader::ReadStream",   # reads vertex/index arrays out of the glTF binary buffer
    # OBJ is an ASCII format, but its reader is fed bytes for the same reason: RWObj_Reader::Read(path) and
    # Probe(path) open the file with std::ios_base::in | std::ios_base::binary and hand that stream to the
    # istream& overload (RWObj_Reader.hxx:53-56,74-77), and read() takes the file length from tellg()
    # (RWObj_Reader.cxx:114-116), which only a binary stream reports in bytes (2026-09-23).
    "RWObj_Reader::Read",
    "RWObj_Reader::Probe",
]

# Classes that get zero-copy numpy accessors (State.md 8.10, R-VIEW). The emitter appends
#     ocp3x_def_views<Class>(cls);
# to the class's define phase and includes src/cpp/common/ocp3x_views.h, where the accessors themselves are a
# template specialisation -- one per class, because every case has runtime branches a config file cannot carry
# (Poly_Triangulation's dtype follows IsDoublePrecision(); Image_PixMap's rows are padded, so its view needs a
# stride from SizeRowBytes()). A name listed here without a specialisation does not link, and
# tests/test_generator.py asserts the two lists agree so it fails at generation instead.
# R-BYTES: methods where a `const uint8_t*` parameter and the length that follows it are one `bytes`
# parameter. Listed rather than inferred -- "the next integer is the length" is a convention, not a type --
# so every entry here has been read in the header. Class::method, every overload; an overload whose buffer
# is an *output* (a non-const uint8_t* / char*) is unaffected and stays unbound.
[bytes]
members = [
    "FSD_Base64::Encode",     # Encode(const uint8_t* theData, size_t theDataLen) -> TCollection_AsciiString.
                              # Its Decode counterpart was already bound and returns an NCollection_Buffer,
                              # which R-VIEW made readable (8.10a); without this, base64 only went one way.
]

[views]
classes = [
    "Poly_Triangulation",
    "Poly_PolygonOnTriangulation",
    "Image_PixMap",
    "NCollection_Buffer",
]
